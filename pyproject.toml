[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdatum"
version = "0.2.0"
description = "Job postings and the employers behind them, from the command line -- for scripts and AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
]
keywords = ["jobs", "job-postings", "employers", "data", "api", "cli", "ai-agents"]
authors = [{name = "Pearachute", email = "pdatum@pearachute.com"}]
dependencies = [
    "requests>=2.31.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
pdatum = "pdatum.cli:main"

[project.urls]
Homepage = "https://pdatum.pearachute.com"
Documentation = "https://pdatum.pearachute.com/api/v1/docs"
Repository = "https://github.com/japherwocky/pdatum"
Issues = "https://github.com/japherwocky/pdatum/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdatum*"]
