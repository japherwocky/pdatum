name: Publish to PyPI

# Releasing is tagging: v0.1.0. Trusted publishing, so there is no token to
# keep: PyPI's publisher for "pdatum" names this repository and this file, and
# renaming either breaks releases.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    name: Build and publish pdatum
    runs-on: ubuntu-latest

    permissions:
      id-token: write      # PyPI trusted publishing
      contents: write      # creating the GitHub release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the tag matches the packaged version
        # PyPI versions can never be reused, so publishing under the wrong
        # number is permanent. Fail first if the tag disagrees with either
        # place the version is written.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys
          from pathlib import Path

          expected = os.environ["TAG"].removeprefix("v")
          found = {
              "pyproject.toml": re.search(r'^version\s*=\s*"([^"]+)"', Path("pyproject.toml").read_text(), re.M),
              "pdatum/__init__.py": re.search(r'__version__\s*=\s*"([^"]+)"', Path("pdatum/__init__.py").read_text()),
          }
          problems = [
              f"{name} says {m.group(1) if m else 'nothing'}, the tag says {expected}"
              for name, m in found.items() if not m or m.group(1) != expected
          ]
          if problems:
              sys.exit("; ".join(problems))
          print(f"OK: {expected}")
          PY

      - name: Test
        run: |
          pip install .
          python -m unittest discover -s tests

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
